    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return customFetch; },
            set: function(fn) { customFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (desc && !desc.set) {
                var pFetch = desc.get ? desc.get.call(window) : window.fetch;
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return pFetch; },
                  set: function(fn) { pFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            }
          } catch (_) {}
        }
      })();
